version: 2
updates:
  - package-ecosystem: pip
    directory: /document-rag-platform/services/backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    commit-message:
      prefix: deps(backend)

  - package-ecosystem: npm
    directory: /document-rag-platform/apps/web
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    commit-message:
      prefix: deps(frontend)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: deps(actions)

# Dependency PRs are review-only; no auto-merge configuration is present.
