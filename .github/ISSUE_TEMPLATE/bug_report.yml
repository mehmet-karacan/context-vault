name: Bug report
description: Report a reproducible Context Vault defect without attaching private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, private document content, raw transcripts or personal data.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal public-safe steps and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Include commit SHA, versions and redacted logs or artifact hashes.
    validations:
      required: true
