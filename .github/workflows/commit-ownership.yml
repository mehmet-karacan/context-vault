name: commit-ownership

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-ownership-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Commit sahiplik ve vocab denetimi
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_MAIN_REF: ${{ github.ref == 'refs/heads/main' }}
        run: |
          refspec="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            refspec="$BASE_SHA..$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            refspec="$BEFORE_SHA..$HEAD_SHA"
          fi

          committer_args=()
          if [[ "$IS_MAIN_REF" == "true" ]]; then
            committer_args+=(--allowed-committer "GitHub noreply@github.com")
          fi
          python scripts/check_commit_ownership.py \
            --repo "$GITHUB_WORKSPACE" \
            --refspec "$refspec" \
            --allowed-author "mehmet-karacan karacan.mehmet@hotmail.com" \
            --allowed-author "Mehmet KARACAN karacan.mehmet@hotmail.com" \
            "${committer_args[@]}"
