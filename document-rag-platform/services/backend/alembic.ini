[alembic]
# Path to migration scripts, relative to this file (services/backend/).
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone used when rendering the date/time in new revision file names.
timezone = UTC

# Max length of the "slug" appended to migration filenames.
truncate_slug_length = 40

# sqlalchemy.url is intentionally left blank here. alembic/env.py overrides
# it at runtime from src.config.settings.DATABASE_URL, so there is exactly
# one source of truth for the connection string (matches src/db.py).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
