[project]
name = "context-vault-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.13.1",
  "argon2-cffi>=23.1.0,<26",
  "asyncpg==0.29.0",
  "boto3==1.34.0",
  "celery==5.3.4",
  "cryptography>=46,<51",
  "fastapi==0.141.1",
  "httpx==0.26.0",
  "minio==7.2.5",
  "openai==1.58.1",
  "pgvector==0.2.5",
  "psycopg2-binary==2.9.9",
  "pydantic-settings>=2.9.0,<3",
  "pydantic>=2.9.0,<3",
  "pypdf==6.16.2",
  "pyyaml==6.0.3",
  "python-docx==1.2.0",
  "python-magic==0.4.27",
  "python-multipart==0.0.32",
  "redis==5.0.1",
  "sqlalchemy==2.0.25",
  "uvicorn[standard]==0.27.0",
]

[project.optional-dependencies]
local-eval = [
  "sentence-transformers==6.0.1",
  "torch==2.14.0",
  "transformers==5.15.1",
]

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.1.0,<8",
  "jsonschema[format-nongpl]==4.26.0",
  "mypy==1.9.0",
  "pip-audit>=2.9.0,<3",
  "pip-licenses==5.5.5",
  "pytest-cov>=5.0.0,<8",
  "pytest==9.1.1",
  "ruff==0.4.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that require external services",
  "evals: deterministic offline evaluation tests",
  "leakage: authorization or data-leakage tests",
  "citation: citation contract tests",
  "baseline: evaluation regression baseline tests",
]

[tool.coverage.report]
fail_under = 77
show_missing = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
show_error_codes = true
