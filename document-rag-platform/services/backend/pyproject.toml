[project]
name = "context-vault-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.13.1",
  "argon2-cffi>=23.1.0,<26",
  "asyncpg==0.29.0",
  "boto3==1.34.0",
  "celery==5.3.4",
  "fastapi==0.109.0",
  "httpx==0.26.0",
  "minio==7.2.5",
  "openai==1.58.1",
  "pgvector==0.2.5",
  "psycopg2-binary==2.9.9",
  "pydantic-settings==2.1.0",
  "pydantic==2.5.0",
  "pypdf2==3.0.1",
  "python-docx==1.1.0",
  "python-magic==0.4.27",
  "python-multipart==0.0.6",
  "redis==5.0.1",
  "sqlalchemy==2.0.25",
  "uvicorn[standard]==0.27.0",
]

[dependency-groups]
dev = [
  "cyclonedx-bom>=7.1.0,<8",
  "mypy==1.9.0",
  "pip-audit>=2.9.0,<3",
  "pytest-cov>=5.0.0,<8",
  "pytest==7.4.4",
  "ruff==0.4.4",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external services",
  "evals: deterministic offline evaluation tests",
  "leakage: authorization or data-leakage tests",
  "citation: citation contract tests",
  "baseline: evaluation regression baseline tests",
]
