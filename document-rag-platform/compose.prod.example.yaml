# Hardened example overlay. It contains no credentials or deployable defaults;
# supply every required value from the production secret/configuration system.
services:
  postgres:
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
  redis:
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
  minio:
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
  minio-bootstrap:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
  migration:
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
  backend:
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
  worker:
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 256
  scheduler:
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
