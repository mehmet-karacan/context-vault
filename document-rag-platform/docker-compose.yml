services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: rag-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: rag-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: rag-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-local}
      BIND_HOST: ${BIND_HOST:-0.0.0.0}
      AUTH_MODE: ${AUTH_MODE:-api_key}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-redis}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-context-vault}
      OBJECT_STORAGE_ENCRYPTION_KEY: ${OBJECT_STORAGE_ENCRYPTION_KEY}
      OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS: ${OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS:-false}
      SECRET_KEY: ${SECRET_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_MODELS: ${CHAT_MODELS}
      FEATURE_REPOSITORY_INGESTION: ${FEATURE_REPOSITORY_INGESTION:-false}
      REPOSITORY_ALLOWED_HOSTS: ${REPOSITORY_ALLOWED_HOSTS:-}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
      INGESTION_OUTBOX_RETRY_SECONDS: ${INGESTION_OUTBOX_RETRY_SECONDS:-30}
      INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS:-120}
      STAGING_ORPHAN_GRACE_SECONDS: ${STAGING_ORPHAN_GRACE_SECONDS:-3600}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./services/backend:/app

  worker:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: rag-worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-context-vault}
      OBJECT_STORAGE_ENCRYPTION_KEY: ${OBJECT_STORAGE_ENCRYPTION_KEY}
      OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS: ${OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS:-false}
      SECRET_KEY: ${SECRET_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_MODELS: ${CHAT_MODELS}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
      INGESTION_OUTBOX_RETRY_SECONDS: ${INGESTION_OUTBOX_RETRY_SECONDS:-30}
      INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS:-120}
      STAGING_ORPHAN_GRACE_SECONDS: ${STAGING_ORPHAN_GRACE_SECONDS:-3600}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-30}
    command: celery -A src.workers.celery_app worker -l info
    depends_on:
      - backend
    volumes:
      - ./services/backend:/app

  scheduler:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: rag-scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-context-vault}
      OBJECT_STORAGE_ENCRYPTION_KEY: ${OBJECT_STORAGE_ENCRYPTION_KEY}
      OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS: ${OBJECT_STORAGE_ALLOW_LEGACY_PLAINTEXT_READS:-false}
      SECRET_KEY: ${SECRET_KEY}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      CHAT_MODEL: ${CHAT_MODEL}
      CHAT_MODELS: ${CHAT_MODELS}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-120}
      INGESTION_OUTBOX_RETRY_SECONDS: ${INGESTION_OUTBOX_RETRY_SECONDS:-30}
      INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS: ${INGESTION_OUTBOX_CLAIM_TIMEOUT_SECONDS:-120}
      STAGING_ORPHAN_GRACE_SECONDS: ${STAGING_ORPHAN_GRACE_SECONDS:-3600}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-30}
    command: celery -A src.workers.celery_app beat -l info
    depends_on:
      - worker
    volumes:
      - ./services/backend:/app

volumes:
  postgres_data:
  minio_data:
